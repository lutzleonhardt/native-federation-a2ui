<div class="cf-frame">
  <svg viewBox="0 0 100 58" role="img" [attr.aria-label]="ariaLabel()">
    <path class="cf-track" d="M 10 52 A 40 40 0 0 1 90 52" />
    <path class="cf-fill" d="M 10 52 A 40 40 0 0 1 90 52" [attr.stroke-dasharray]="dashArray()" />
    <text x="50" y="42" text-anchor="middle" class="cf-gauge-value">{{ value() }}</text>
    <text x="50" y="53" text-anchor="middle" class="cf-gauge-max">/ {{ max() }}</text>
  </svg>
  <div class="cf-reading">
    @if (label(); as caption) {
      <span class="cf-badge">{{ caption }}</span>
    }
    <span class="cf-percent">{{ percent() }}</span>
  </div>
</div>
