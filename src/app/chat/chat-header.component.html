<header>
  <div class="cf-band">
    <div class="cf-brand">
      <h1>Conference Finder</h1>
      <span class="cf-eyebrow">FEDERATED AGENTIC UI · DEMO</span>
    </div>
    <app-location-picker />
    <span class="cf-sep"></span>
  </div>
  <nav class="cf-prompts" aria-label="Example prompts">
    @for (prompt of prompts(); track prompt) {
      <button type="button" [disabled]="running()" (click)="send.emit(prompt)">{{ prompt }}</button>
    }
  </nav>
  <app-capability-panel />
  @if (mode === 'replay') {
    <p class="cf-replay">
      <strong>Replay mode</strong> · Recorded answers play back in your browser — no model, no
      server. Each prompt answers on its own.
      <button type="button" (click)="explainAgent()">How it works →</button>
    </p>
  }
</header>
